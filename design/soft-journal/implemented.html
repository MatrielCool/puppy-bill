<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小狗账单 · 实际页面一览</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px 24px; background: #eae8e0; color: #414139; font: 13px 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    header { max-width: 1168px; margin: 0 auto 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { font-size: 17px; font-weight: 500; margin: 0 0 4px; }
    p { color: #77796e; margin: 0; font-size: 11px; }
    nav { display: flex; gap: 6px; flex-shrink: 0; }
    a { padding: 9px 13px; text-decoration: none; color: #414139; border-radius: 10px; background: #f7f5ef; font-size: 12px; }
    a[aria-current] { background: #d5ddca; }
    main { display: flex; justify-content: center; align-items: flex-start; gap: 20px; }
    section { flex: none; }
    iframe { display: block; width: 375px; height: 640px; border: 1px solid #d5d3c9; border-radius: 23px; background: #f5f3ee; color-scheme: light; }
    @media (max-width: 1100px) { main { flex-wrap: wrap; } }
    @media (max-width: 460px) { body { padding: 16px 0; } header { padding: 0 16px; flex-wrap: wrap; } iframe { width: calc(100vw - 24px); } }
  </style>
</head>
<body>
  <header>
    <div><h1>小狗账单 · 柔彩日记</h1><p>以下直接加载现有 React 应用，操作会写入当前本机预览的账本。</p></div>
    <nav><a href="?group=daily" id="daily">记账与账单</a><a href="?group=more" id="more">预算与我的</a><a href="../../" target="_blank">打开 App ↗</a></nav>
  </header>
  <main id="screens"></main>
  <script>
    const group = new URLSearchParams(location.search).get('group') === 'more' ? 'more' : 'daily';
    document.getElementById(group).setAttribute('aria-current', 'page');
    const routes = group === 'daily'
      ? [['/', '记一笔'], ['/list', '账单'], ['/pending', '待入账']]
      : [['/budget', '预算'], ['/settings', '我的']];
    for (const [route, title] of routes) {
      const section = document.createElement('section');
      const frame = document.createElement('iframe');
      frame.src = '../../#' + route;
      frame.title = title;
      section.append(frame);
      document.getElementById('screens').append(section);
    }
  </script>
</body>
</html>
